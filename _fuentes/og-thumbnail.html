<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Thumbnail para compartir (1200×630)</title>
<link rel="stylesheet" href="https://use.typekit.net/soz7rgi.css">
<style>
  @font-face { font-family: "The Valloan"; src: url("../assets/fonts/the-valloan.otf") format("opentype"); }
  @font-face { font-family: "Stempel Schneidler"; src: url("../assets/fonts/StempelSchneidlerStd-Roman.otf") format("opentype"); font-weight: 400; }
  @font-face { font-family: "Stempel Schneidler"; src: url("../assets/fonts/StempelSchneidlerStd-Bold.otf") format("opentype"); font-weight: 700; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #6a0610; }
  .frame { position: absolute; inset: 26px; background: #fffaf7; color: #6a0610; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; text-align: center; }
  .intro { font: 700 20px/1 "Stempel Schneidler", Georgia, serif; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
  .cats { width: 600px; height: 316px; display: block; margin: 0 0 10px; }
  .names { font: 100 72px/1 "new-kansas", Georgia, serif; letter-spacing: .03em; text-transform: uppercase; display: flex; align-items: center; gap: 22px; }
  .names .y { font: 400 86px/1 "The Valloan", cursive; text-transform: none; letter-spacing: 0; position: relative; top: 6px; }
  .date { font: 400 72px/1 "The Valloan", cursive; margin-top: 40px; }
  .venue { font: 700 21px/1 "Stempel Schneidler", Georgia, serif; letter-spacing: .12em; text-transform: uppercase; margin-top: 22px; }
</style>
</head>
<body>
  <div class="frame">
    <img class="cats" src="../assets/img/gatitos-brindis.svg" alt="">
    <h1 class="names"><span>María</span><span class="y">y</span><span>Fabrizzio</span></h1>
    <p class="date">23 · 01 · 2027</p>
  </div>
</body>
</html>
